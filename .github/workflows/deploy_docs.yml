name: Develop Docs
on:
  push:
    branches:
      - "release/**"
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV
      - uses: actions/cache@v4
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: .cache
          restore-keys: |
            mkdocs-material-
      - run: pip install mike mkdocs-material jieba mkdocs-git-revision-date-localized-plugin mkdocs-git-committers-plugin-2 mkdocs-git-authors-plugin mkdocs-static-i18n mkdocs-minify-plugin 
      - name: Check docs GitHub source links
        run: python tools/check_docs_github_links.py --repo-slug PaddlePaddle/PaddleX --forbidden-ref develop --forbidden-ref main --forbidden-ref master
      - name: Resolve docs GitHub source refs
        run: python tools/resolve_doc_github_refs.py --placeholder '{{PADDLEX_GITHUB_REF}}' --source-ref "${GITHUB_REF_NAME}"
      - name: Deploy docs (version from branch release/X → mike X)
        run: |
          git fetch origin gh-pages --depth=1
          VERSION="${GITHUB_REF_NAME#release/}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "$GITHUB_REF_NAME" ]; then
            echo "Expected branch release/<version>, got: $GITHUB_REF_NAME"
            exit 1
          fi
          mike deploy --push --update-aliases "$VERSION" latest
          mike set-default --push latest
        env:
          DOCS_EDIT_URI: edit/${{ github.ref_name }}/docs/
