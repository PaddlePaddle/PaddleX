Global:
  model: pwgan_csmsc
  mode: predict # only support predict
  device: gpu:0
  output: "output"

Predict:
  use_trt: False
  use_mkldnn: False
  cpu_threads: 1
  precision: "fp32"
  batch_size: 1
  model_dir: "pwgan_csmsc"
  input: "https://paddlespeech.bj.bcebos.com/demos/paddlex/mel.npy"
  lang: zh
  speaker_id: 0
  kernel_option:
    run_mode: paddle
